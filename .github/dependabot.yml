version: 2
updates:
  # Keeps the SHA pins in our workflows current; "/" also covers .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The base images in the Dockerfile, pinned by tag and digest.
  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: weekly
    ignore:
      # The build image tracks the Node version CI and package.json engines use.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript below 6.1, so anything newer breaks lint and typecheck.
      - dependency-name: typescript
        versions: [">=6.1"]
      # Keep the Node types in step with the Node version we target.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
