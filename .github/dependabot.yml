version: 2
updates:
  # Keeps the SHA pins in our workflows current; "/" also covers .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The base images in the Dockerfile, pinned by tag and digest.
  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
