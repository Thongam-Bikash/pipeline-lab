server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The page itself must never be cached, or a deploy leaves people on the old app.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # worker-src allows the editor's web workers; the app talks to nothing else.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Asset filenames contain a content hash, so they can be cached forever.
    location /assets/ {
        # One header only: `expires` would add a second, conflicting Cache-Control.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Every other path is a client-side route and falls back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
